name: Linux build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Initialize shared core
        run: git submodule update --init shared/deskport-core
      - name: Shared core adapter contract
        run: nix develop -c python3 scripts/test-core.py
      - name: Build
        run: nix build -L
      - name: CLI and desktop-entry smoke check
        run: python3 scripts/deskport-smoke.py ./result

      - name: Smart streaming policy and translations
        run: |
          nix develop -c python3 scripts/test-smart-stream.py
          python3 scripts/test-translations.py
          nix develop -c python3 scripts/test-compiled-translations.py
          nix develop -c python3 scripts/test-host-pipewire-memory.py
          nix develop -c python3 scripts/test-host-display-ownership.py
          nix develop -c python3 scripts/test-host-vulkan-lifetime.py
          nix develop -c python3 scripts/test-host-lifecycle.py --binding

      - name: VM disk guard checks (no virtual machine required)
        run: python3 scripts/test-macos-vm-guard.py

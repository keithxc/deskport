name: Display control contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  display:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - run: nix develop -c python3 tests/test-core.py
      - run: nix develop -c python3 tests/test-host-lifecycle.py --binding
      - run: nix develop -c python3 tests/test-host-lifecycle.py
      - run: nix develop -c python3 tests/test-host-macos-shutdown.py --work-dir "${{ runner.temp }}/host-macos-shutdown"
      - run: nix develop -c python3 tests/test-session-topology.py
      - name: Recovery opt-in lifecycle policy
        run: |
          work="$(bash scripts/build-paths.sh checkout)/recovery-policy"
          mkdir -p "$work"
          export TMPDIR="$work"
          nix develop -c xcrun clang++ -std=c++17 -Wall -Wextra -Werror \
            -fsanitize=address,undefined tests/recovery-policy.cpp -o "$work/recovery-policy"
          "$work/recovery-policy"
